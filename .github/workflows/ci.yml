name: CI

on:
  push:
  pull_request:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install build
      - run: python -m build --wheel --outdir "$RUNNER_TEMP/wheels" -Ccmake.define.CMAKE_CUDA_COMPILER=NOTFOUND
      - run: python -m pip install "$RUNNER_TEMP"/wheels/*.whl pytest pytest-cov nbformat
      - name: Test the installed distribution outside the source checkout
        working-directory: ${{ runner.temp }}
        env:
          MPLBACKEND: Agg
        run: |
          python -c 'import eopl; print(eopl.__file__)'
          python -c 'import xarray, zarr; print("xarray", xarray.__version__, "zarr", zarr.__version__)'
          python -m pip check
          python -m pytest "$GITHUB_WORKSPACE/tests"

  distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build --outdir "$RUNNER_TEMP/dist" -Ccmake.define.CMAKE_CUDA_COMPILER=NOTFOUND
      - run: python -m twine check "$RUNNER_TEMP"/dist/*

  cuda-build:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.4.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y python3 python3-pip
      - run: python3 -m pip install --upgrade pip build
      - run: python3 -m build --wheel
