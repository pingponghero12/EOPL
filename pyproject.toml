[build-system]
requires = [
    "scikit-build-core>=0.11",
    "pybind11>=2.12"
]
build-backend = "scikit_build_core.build"

[project]
name = "eopl"
version = "0.1.0"
description = "Earth observation pipeline orchestration, data products, and reproducible reports"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Manfred Gawlas", email = "manfredgawlas12@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy",
    "xarray",
    "dask",
    "distributed",
    "zarr<3",
    "netCDF4",
    "pyyaml",
    "scipy",
    "matplotlib"
]

[project.optional-dependencies]
notebook = [
    "jupyterlab",
    "ipykernel",
]
test = [
    "pytest>=7",
    "pytest-cov>=4",
    "nbformat>=5",
]

[project.urls]
Repository = "https://github.com/pingponghero12/EOPL"
Issues = "https://github.com/pingponghero12/EOPL/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.scikit-build]
cmake.version = ">=3.22"
cmake.build-type = "Release"
wheel.packages = ["eopl"]
sdist.exclude = [
    ".pytest_cache", "**/__pycache__", "*.egg-info", "build", "dist",
    "**/outputs", "examples/prototype_*/input", "**/*.so", ".coverage", "htmlcov",
]
