[build-system]
requires = [
    "scikit-build-core>=0.11",
    "pybind11>=2.12"
]
build-backend = "scikit_build_core.build"

[project]
name = "eopl"
version = "0.1.0"
description = "Earth observation pipeline orchestration, data products, and reproducible reports"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    {name = "Manfred Gawlas", email = "manfredgawlas12@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy",
    # Xarray 2026.4+ requires zarr-python 3; keep this release on the v2 backend.
    "xarray<2026.4",
    "dask",
    "distributed",
    "zarr>=2.18,<3",
    "netCDF4",
    "pyyaml",
    "scipy",
    "matplotlib"
]

[project.optional-dependencies]
notebook = [
    "jupyterlab",
    "ipykernel",
]
test = [
    "pytest>=7",
    "pytest-cov>=4",
    "nbformat>=5",
]

[project.urls]
Repository = "https://github.com/pingponghero12/EOPL"
Issues = "https://github.com/pingponghero12/EOPL/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.scikit-build]
cmake.version = ">=3.22"
cmake.build-type = "Release"
wheel.packages = ["eopl"]
sdist.exclude = [
    ".pytest_cache", "**/__pycache__", "*.egg-info", "build", "dist",
    "**/outputs", "examples/prototype_*/input", "**/*.so", ".coverage", "htmlcov",
]

[tool.cibuildwheel]
# Match the Python versions currently covered by CI.
build = "cp310-* cp311-* cp312-*"
skip = "*-musllinux_*"
archs = ["native"]
test-extras = ["test"]
test-command = [
    'python -c "import eopl.eopl_cpp_core"',
    'python -m pip check',
    'python -m pytest "{project}/tests"',
]
environment = { MPLBACKEND = "Agg" }

[tool.cibuildwheel.config-settings]
# Published wheels run on machines without the CUDA toolkit.
"cmake.define.CMAKE_CUDA_COMPILER" = "NOTFOUND"
